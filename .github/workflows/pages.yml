name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stack-learner-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish doc/ to the Pages branch
        run: git push origin "$(git subtree split --prefix=doc HEAD):gh-pages"
