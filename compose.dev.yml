name: boilerplate-learner

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5445}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_EXTERNAL:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/backend/Dockerfile.dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: false
      COOKIE_SAME_SITE: Lax
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REDIS_ADDR: redis:6379
      SERVER_PORT: 8000
      SERVER_MODE: debug
      MEDIA_DIR: /app/media
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app
      - go_build_cache:/root/.cache/go-build
      - go_module_cache:/go/pkg
      - media:/app/media
    ports:
      - "${BACKEND_PORT_EXTERNAL:-8011}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/frontend/Dockerfile.dev
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost}
      VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:-http://localhost/api}
      CI: "true"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT_EXTERNAL:-5174}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: ./infrastructure/nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - media:/srv/media:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/health && wget -q --spider http://127.0.0.1/admin/learning"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  media:
  frontend_modules:
  go_build_cache:
  go_module_cache:
